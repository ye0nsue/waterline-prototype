<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WATERLINE 휠체어 태그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F5F1; --card:#FCFCFA; --ink:#16202B; --muted:#56616D; --line:#D9DDD6;
  --blue:#1F5FBF; --blue-soft:#E3ECF8; --orange:#B8471A; --green:#1D6B4F; --green-soft:#DDEFE6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',Arial,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:22px;font-weight:900;letter-spacing:.04em;color:var(--blue)}
.brand span{color:var(--muted);font-size:14px}
.links{display:flex;gap:8px}
.links a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:#fff}
.links a:hover{border-color:var(--blue);color:var(--blue)}
.tabs{display:flex;gap:8px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab:hover{border-color:var(--blue)}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 24px 32px}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#f3f3f0 45%,#dcddd8 100%);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:min(calc(100vh - 190px),780px);min-height:520px;align-self:start;position:sticky;top:16px}
.stage.dark{background:radial-gradient(120% 90% at 50% 38%,#2a3139 0%,#161b21 50%,#07090b 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(14px,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);background:rgba(252,252,250,.92);border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 8px;transition:opacity .2s}
.lbl::before{content:"";position:absolute;left:-14px;top:50%;width:14px;height:1px;background:var(--ink)}
.lbl::after{content:"";position:absolute;left:-18px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--blue);border:1.5px solid #fff}
.lbl i{width:8px;height:8px;border-radius:2px;flex:none}
.lbl.hi{border-color:var(--blue);color:var(--blue)}
.hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.ctrl{display:flex;align-items:center;gap:8px;background:rgba(252,252,250,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ctrl label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ctrl input[type=range]{width:140px}
.ctrl output{font-size:13px;font-weight:700;min-width:44px;text-align:right}
.btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsbtn{position:absolute;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:rgba(252,252,250,.95);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.fsbtn:hover{border-color:var(--blue)}
.fsbtn svg{width:15px;height:15px}
.stage:fullscreen{width:100%;height:100%;min-height:0;border:0;border-radius:0}
.stage:-webkit-full-screen{width:100%;height:100%;min-height:0;border:0;border-radius:0}
.stage.full{position:fixed;inset:0;top:0;width:100vw;height:100vh;height:100dvh;align-self:stretch;min-height:0;border:0;border-radius:0;z-index:1000}
body.nofs-scroll{overflow:hidden}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);background:rgba(252,252,250,.9);border-radius:8px;padding:3px 8px;pointer-events:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 4px;font-size:15px}
.panel .sub{margin:0 0 12px;font-size:12px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:16px}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.parts li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;cursor:default;transition:border-color .2s,background .2s}
.parts li:hover,.parts li.hi{border-color:var(--blue);background:var(--blue-soft)}
.parts b{display:flex;align-items:center;gap:8px;font-size:14px}
.parts b i{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(22,32,43,.4)}
.parts small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5}
.water{display:flex;flex-direction:column;gap:8px}
.water .row{display:flex;justify-content:space-between;align-items:center}
.water .val{font-weight:900;font-size:22px}
.sens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sens span{text-align:center;font-size:12px;font-weight:700;border-radius:8px;padding:6px 0;background:#EEF0EC;color:var(--muted);transition:background .2s,color .2s}
.sens span.wet{background:var(--blue);color:#fff}
.state{font-size:13px;font-weight:700;border-radius:10px;padding:8px 12px;background:var(--green-soft);color:var(--green)}
.state.warn{background:#FBE6DB;color:var(--orange)}
.notes{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.notes li{margin:4px 0}
.notes b{color:var(--blue)}
footer{padding:0 24px 24px;color:var(--muted);font-size:12px}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  header{padding:12px 16px}
  .tabs{padding:12px 16px;gap:6px}
  .tab{flex-direction:column;gap:4px;font-size:12px;padding:8px 6px}
  main{padding:12px 16px 24px;gap:12px}
  .stage{height:62vh;min-height:420px;position:relative;top:auto}
  .ctrl input[type=range]{width:120px}
  .lbl{font-size:11px}
  footer{padding:0 16px 20px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>WATERLINE</b><span>휠체어 태그 · 3D 제품 목업</span></div>
  <nav class="links"><a href="index.html">프로토타입</a><a href="slides.html">디자인 설명</a></nav>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-v="tag" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="7" rx="2"/><path d="M12 10v3"/><rect x="10.5" y="13" width="3" height="8" rx="1"/></svg>태그 단독</button>
  <button class="tab" role="tab" data-v="manual" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="10" cy="15" r="6"/><circle cx="19" cy="19" r="2"/><path d="M8 3v9h8l3 5"/></svg>수동휠체어 장착</button>
  <button class="tab" role="tab" data-v="power" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="5" y="13" width="14" height="5" rx="1.5"/><circle cx="8" cy="19" r="2.5"/><circle cx="17" cy="19.5" r="1.5"/><path d="M7 13V4h4v9M11 9h8"/></svg>전동휠체어 장착</button>
</div>

<main>
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="휠체어 태그 3D 모델. 드래그해서 돌려볼 수 있습니다."></canvas>
    <div class="labels" id="labels"></div>
    <button class="fsbtn" id="fsBtn" type="button" aria-label="전체 화면으로 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="i-open" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="i-close" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" style="display:none"/></svg><span>전체 화면</span></button>
    <div class="hint">드래그로 회전 · 휠/핀치로 확대</div>
    <div class="hud">
      <div class="ctrl"><label for="rot">회전</label><input type="range" id="rot" min="0" max="359" value="35"><output id="rotOut">35°</output></div>
      <div class="ctrl">
        <button class="btn on" id="auto">자동 회전</button>
        <button class="btn" data-view="front">정면</button>
        <button class="btn" data-view="side">측면</button>
        <button class="btn" data-view="back">후면</button>
        <button class="btn" data-view="top">위</button>
      </div>
      <div class="ctrl">
        <button class="btn" data-focus="main">본체 확대</button>
        <button class="btn" data-focus="probe">막대 확대</button>
      </div>
      <div class="ctrl"><label><input type="checkbox" id="showLbl" checked> 라벨</label><button class="btn" id="dark">어두운 배경</button></div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h3 id="pTitle">태그 구성</h3>
      <p class="sub" id="pSub"></p>
      <ul class="parts" id="parts"></ul>
    </div>
    <div class="panel water">
      <h3>수위 시연</h3>
      <p class="sub" style="margin:0">바닥에서 물이 차오르면 막대 속 센서가 아래부터 차례로 반응합니다.</p>
      <div class="row"><span class="val" id="wVal">0 cm</span><input type="range" id="wl" min="0" max="40" value="0" style="width:60%"></div>
      <div class="sens" id="sens"><span>5cm</span><span>10cm</span><span>20cm</span><span>30cm</span></div>
      <div class="state" id="wState">정상 · 물 감지 없음</div>
    </div>
    <div class="panel">
      <h3 id="nTitle">재질 · 기술</h3>
      <ul class="notes" id="notes"></ul>
    </div>
  </div>
</main>
<footer>개념 설계용 3D 모형입니다. 크기와 장착 위치는 실제 휠체어 기종에 따라 달라지며, 시제품 검증이 필요합니다.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const D2R=Math.PI/180;
const C={ink:0x16202B,blue:0x1F5FBF,silver:0xB4BCC4,light:0xEEF2F5,soft:0xE3ECF8};

/* ---------- renderer ---------- */
const canvas=document.getElementById('gl'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,1,3000);

/* ---------- studio environment: softboxes baked into a reflection map ---------- */
(function(){
  const env=new THREE.Scene();
  const room=new THREE.Mesh(new THREE.BoxGeometry(200,120,200),new THREE.MeshBasicMaterial({color:new THREE.Color(.06,.063,.066),side:THREE.BackSide}));
  room.position.y=40; env.add(room);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:new THREE.Color(.12,.12,.115)}));
  fl.rotation.x=-Math.PI/2; fl.position.y=-19.5; env.add(fl);
  function panel(w,h,pos,k){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k*1.02),side:THREE.DoubleSide}));
    m.position.set(...pos); m.lookAt(0,10,0); env.add(m);
  }
  panel(110,80,[0,98,10],1.5);      // top softbox
  panel(50,90,[-95,40,50],1.2);     // key strip, front-left
  panel(26,100,[95,45,-30],1.5);    // rim strip, back-right
  panel(70,40,[30,30,98],.25);      // low front fill
  panel(60,14,[-40,70,-98],.9);     // back kicker
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,.03).texture;
  pm.dispose();
})();
const key=new THREE.DirectionalLight(0xffffff,.85);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.bias=-.0006; key.shadow.normalBias=.08;
scene.add(key); scene.add(key.target);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8b8b0,.18));

/* ---------- procedural textures ---------- */
function noiseTex(size,fn,rep){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'), im=x.createImageData(size,size);
  for(let i=0;i<size*size;i++){const v=fn(i%size,(i/size)|0);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}
  x.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); t.anisotropy=8; return t;
}
const grainTex=noiseTex(256,()=>110+Math.random()*90,2.2);        // fine mould texture
const softTex=noiseTex(128,()=>120+Math.random()*50,1.2);         // rubber / silicone
const brushTex=(()=>{const row=[];return noiseTex(256,(x,y)=>{if(row[y]===undefined)row[y]=120+Math.random()*110;return row[y]*.75+Math.random()*50;},1);})();
const weaveTex=noiseTex(64,(x,y)=>((x>>2)+(y>>2))%2?170:120,6);   // woven fabric

/* ---------- materials ---------- */
const S=o=>new THREE.MeshStandardMaterial(o), P=o=>new THREE.MeshPhysicalMaterial(o);
const MAT={
  housing:S({color:0x2a2f35,roughness:.82,bumpMap:grainTex,bumpScale:.012}),
  housingSmooth:S({color:0x23272c,roughness:.5}),
  panel:P({color:0x14171b,roughness:.38,clearcoat:.5,clearcoatRoughness:.3}),
  bumper:S({color:0x1c62c9,roughness:.72,bumpMap:softTex,bumpScale:.006}),
  silicone:S({color:0x3a4047,roughness:.93,bumpMap:softTex,bumpScale:.004}),
  rubber:S({color:0x15181c,roughness:.9,bumpMap:softTex,bumpScale:.006}),
  cable:S({color:0x121417,roughness:.62}),
  steel:S({color:0xd9dde0,roughness:.3,metalness:1,roughnessMap:brushTex,envMapIntensity:1.1}),
  steelDS:S({color:0xd9dde0,roughness:.3,metalness:1,roughnessMap:brushTex,envMapIntensity:1.1,side:THREE.DoubleSide}),
  alu:S({color:0xc6cace,roughness:.42,metalness:1,roughnessMap:brushTex,envMapIntensity:.9}),
  nickel:S({color:0xb9bdc2,roughness:.22,metalness:1}),
  probe:P({color:0xf4f5f5,roughness:.42,clearcoat:.35,clearcoatRoughness:.35}),
  mark:S({color:0x7d8791,roughness:.7}),
  padBase:S({color:0xdfe5ec,roughness:.88,bumpMap:weaveTex,bumpScale:.01}),
  padCell:S({color:0x3478dc,roughness:.6,bumpMap:softTex,bumpScale:.004}),
  dot:S({color:0x08090a,roughness:.9}),
  /* wheelchair */
  fabric:S({color:0x222a33,roughness:.96,bumpMap:weaveTex,bumpScale:.03}),
  tire:S({color:0x1b1e22,roughness:.88,bumpMap:softTex,bumpScale:.02}),
  shell:P({color:0x2a333d,roughness:.5,clearcoat:.25,clearcoatRoughness:.4}),
  shellBlue:P({color:0x1f5fbf,roughness:.38,clearcoat:.6,clearcoatRoughness:.25}),
  vinyl:S({color:0x1e5cb8,roughness:.6,bumpMap:softTex,bumpScale:.02}),
  cushion:S({color:0x1f5fbf,roughness:.8,transparent:true,opacity:.3,depthWrite:false})
};
const ledMat=S({color:0x0c2a1c,roughness:.55,emissive:0x12e07f,emissiveIntensity:1});
const glowMat=(()=>{
  const gc=document.createElement('canvas'); gc.width=gc.height=128; const gx=gc.getContext('2d');
  const gr=gx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(.25,'rgba(255,255,255,.3)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  gx.fillStyle=gr; gx.fillRect(0,0,128,128);
  return new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),color:0x40ffa8,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});
})();

/* ---------- part registry ---------- */
let REG;
/* M('housing')          → shared material
   M('housing','main')   → per-view copy registered to a part, so the side panel can highlight it */
function M(name,part){
  if(!part) return MAT[name];
  const k=part+'|'+name;
  if(!REG.mc[k]){REG.mc[k]=MAT[name].clone();(REG.parts[part]=REG.parts[part]||[]).push(REG.mc[k]);}
  return REG.mc[k];
}

/* ---------- geometry helpers ---------- */
function creased(g,deg=28){            // smooth normals across fillets, keep flat faces flat
  g=g.index?g.toNonIndexed():g;
  const p=g.attributes.position, n=p.count/3, fn=[], cos=Math.cos(deg*D2R), map=new Map();
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
  const keyOf=i=>Math.round(p.getX(i)*2e3)+'_'+Math.round(p.getY(i)*2e3)+'_'+Math.round(p.getZ(i)*2e3);
  for(let f=0;f<n;f++){
    a.fromBufferAttribute(p,f*3);b.fromBufferAttribute(p,f*3+1);c.fromBufferAttribute(p,f*3+2);
    fn.push(b.sub(a).cross(c.sub(a)).clone());
    for(let k=0;k<3;k++){const kk=keyOf(f*3+k);(map.get(kk)||map.set(kk,[]).get(kk)).push(f);}
  }
  const un=fn.map(v=>v.clone().normalize()), out=new Float32Array(p.count*3), acc=new THREE.Vector3();
  for(let f=0;f<n;f++)for(let k=0;k<3;k++){
    const i=f*3+k; acc.set(0,0,0);
    if(Math.abs(un[f].z)>.9995) acc.copy(un[f]);
    else{ map.get(keyOf(i)).forEach(o=>{if(un[o].dot(un[f])>=cos&&Math.abs(un[o].z)<=.9995)acc.add(fn[o]);}); acc.normalize(); }
    out[i*3]=acc.x;out[i*3+1]=acc.y;out[i*3+2]=acc.z;
  }
  g.setAttribute('normal',new THREE.BufferAttribute(out,3)); return g;
}
function rrShape(w,h,r){
  r=Math.max(.001,Math.min(r,w/2-.001,h/2-.001));
  const s=new THREE.Shape(),x=w/2,y=h/2;
  s.moveTo(-x+r,-y);s.lineTo(x-r,-y);s.absarc(x-r,-y+r,r,-Math.PI/2,0,false);
  s.lineTo(x,y-r);s.absarc(x-r,y-r,r,0,Math.PI/2,false);
  s.lineTo(-x+r,y);s.absarc(-x+r,y-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(-x,-y+r);s.absarc(-x+r,-y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}
/* rounded box: w×h outline (corner radius r) extruded along z by d, edge fillet b */
const geoCache={};
function rbox(w,h,d,r,b){
  const k=[w,h,d,r,b].join();
  if(geoCache[k]) return geoCache[k];
  b=Math.min(b,d/2-.001,w/2-.001,h/2-.001);
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,Math.max(r-b,.001)),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:5,curveSegments:14});
  g.center(); return geoCache[k]=creased(g);
}
function mesh(geo,mat,parent,pos,rot){
  const m=new THREE.Mesh(geo,mat); m.castShadow=m.receiveShadow=true;
  if(pos)m.position.set(...pos); if(rot)m.rotation.set(...rot);
  parent.add(m); return m;
}
const cyl=(r1,r2,h,seg=40,open=false)=>new THREE.CylinderGeometry(r1,r2,h,seg,1,open);
const lathe=(pts,seg=48)=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);
/* generic soft box for wheelchair parts */
function box(w,h,d,mat,parent,pos,r=.6){return mesh(rbox(w,h,d,r,Math.min(r*.7,Math.min(w,h,d)*.45)),mat,parent,pos);}
/* frame tube with rounded joints */
const ballGeo=new THREE.SphereGeometry(1,20,14);
function tube(a,b,r,mat,parent,caps=true){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
  const me=mesh(cyl(r,r,A.distanceTo(B),28),mat,parent);
  me.position.copy(A).add(B).multiplyScalar(.5);
  me.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());
  if(caps)[A,B].forEach(v=>{const s=mesh(ballGeo,mat,parent,v.toArray());s.scale.setScalar(r);});
  return me;
}
/* worm-drive band clamp around a tube whose axis is local Y */
function bandClamp(parent,pos,R,rot){
  const g=new THREE.Group(); g.position.set(...pos); if(rot)g.rotation.set(...rot); parent.add(g);
  const st=M('steel','clamp');
  mesh(cyl(R,R,.8,56,true),M('steelDS','clamp'),g);
  for(let i=0;i<9;i++){const a=Math.PI+(-.55+i*.1375);mesh(new THREE.BoxGeometry(.07,.42,.03),MAT.dot,g,[Math.sin(a)*(R+.005),0,Math.cos(a)*(R+.005)],[0,a,0]);}
  mesh(rbox(1.25,.95,.75,.15,.08),st,g,[0,0,-R-.3]);                       // screw housing
  mesh(cyl(.2,.2,1.7,20),M('nickel','clamp'),g,[.1,0,-R-.36],[0,0,Math.PI/2]);
  mesh(cyl(.36,.36,.3,6),M('nickel','clamp'),g,[1,0,-R-.36],[0,0,Math.PI/2]);
  return g;
}
/* M12 cable gland with flex strain relief, cable exits along local -Y */
function gland(parent,pos,rot,part){
  const g=new THREE.Group(); g.position.set(...pos); if(rot)g.rotation.set(...rot); parent.add(g);
  mesh(cyl(.78,.78,.34,6),M('nickel',part),g,[0,-.17,0]);
  mesh(cyl(.6,.6,.22,32),M('nickel',part),g,[0,-.45,0]);
  mesh(cyl(.56,.72,.52,6),M('rubber',part),g,[0,-.82,0]);
  const prof=[[0,-1.08]]; for(let i=0;i<5;i++){const y=-1.08-i*.26,r=.5-i*.035;prof.push([r,y],[r,y-.15],[r-.07,y-.17],[r-.07,y-.26]);}
  prof.push([.3,-2.4],[0,-2.4]);
  mesh(lathe(prof.reverse()),M('rubber',part),g);
  return g;
}
function anchor(parent,pos,key,text,color){
  const o=new THREE.Object3D(); o.position.set(...pos); parent.add(o);
  REG.anchors.push({o,key,text,color}); return o;
}

/* ---------- the tag ---------- */
const SENS=[5,10,20,30];       // floor-referenced heights (cm)
const PROBE_BOTTOM=2, PROBE_LEN=42;
function makeProbe(parent,{pos,rotY=0,clampYs,stub=false}){
  const g=new THREE.Group(); g.position.set(pos[0],PROBE_BOTTOM,pos[2]); g.rotation.y=rotY; parent.add(g);
  mesh(rbox(2.8,PROBE_LEN,1.5,.55,.16),M('probe','probe'),g,[0,PROBE_LEN/2,0]);
  mesh(rbox(.9,PROBE_LEN-6,.04,.2,.015),M('housingSmooth','probe'),g,[0,PROBE_LEN/2,-.75]);   // potting seam, back
  SENS.forEach(h=>{                                                                            // capacitive windows
    const y=h-PROBE_BOTTOM;
    mesh(rbox(2.24,2.74,.05,.36,.02),MAT.mark,g,[0,y,.735]);
    const m=S({color:0xb4bcc4,roughness:.5,metalness:.15,emissive:0x000000});
    mesh(rbox(2.06,2.56,.06,.3,.025),m,g,[0,y,.745]);
    mesh(new THREE.BoxGeometry(.5,.045,.02),MAT.mark,g,[1.02,y,.752]);
    REG.sensors.push({m,h});
  });
  for(let y=4;y<=38;y+=2) if(!SENS.includes(y+PROBE_BOTTOM)) mesh(new THREE.BoxGeometry(y%10===8?.34:.2,.035,.02),MAT.mark,g,[1.15,y,.752]);
  mesh(rbox(3.16,3.2,1.86,.62,.2),M('housing','probe'),g,[0,PROBE_LEN+.5,0]);                  // overmoulded top cap
  mesh(new THREE.BoxGeometry(3.17,.05,1.87),MAT.dot,g,[0,PROBE_LEN-.55,0]);
  gland(g,[0,PROBE_LEN+2.1,0],[Math.PI,0,0],'probe');
  mesh(rbox(3.16,1.8,1.86,.6,.24),M('rubber','probe'),g,[0,.3,0]);                             // TPU foot
  if(stub){
    mesh(cyl(1.2,1.2,36,48),MAT.alu,g,[0,23,-2.6]);
    [41.2,4.8].forEach(y=>mesh(cyl(1.08,1.08,.5,32),MAT.rubber,g,[0,y,-2.6]));
  }
  clampYs.forEach(y=>{
    mesh(rbox(2.5,2.3,1.1,.3,.12),M('silicone','clamp'),g,[0,y,-1.2]);                         // silicone saddle
    bandClamp(g,[0,y,-2.6],1.25);
  });
  anchor(g,[0,PROBE_LEN*.62,1],'probe','물 감지 막대',C.light);
  anchor(g,[0,clampYs[clampYs.length-1],-2.6],'clamp','밴드 클램프',C.silver);
  REG.focus.probe={t:[pos[0],PROBE_BOTTOM+19,pos[2]],d:100,theta:rotY+24*D2R};
  return g;
}
/* mount: 'tube' = saddle + two band clamps on a Ø20 frame tube, 'plate' = flat bracket on a panel */
function makeMain(parent,{pos,rotY=0,stub=false,mount='tube'}){
  const g=new THREE.Group(); g.position.set(...pos); g.rotation.y=rotY; parent.add(g);
  mesh(rbox(9,6,3,1.15,.42),M('housing','main'),g);
  mesh(rbox(9.3,6.3,1.15,1.3,.3),M('bumper','main'),g);                                        // TPU bumper band
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>mesh(rbox(1.5,1.5,1.5,.7,.3),M('bumper','main'),g,[sx*3.98,sy*2.48,0]));
  mesh(rbox(7.5,4.5,.08,.75,.03),M('panel','main'),g,[0,0,1.49]);                              // inset front panel
  mesh(new THREE.TorusGeometry(1.27,.09,14,64),M('housingSmooth','main'),g,[-2.35,.25,1.53]);  // SOS button
  const dome=mesh(new THREE.SphereGeometry(1.14,48,24,0,Math.PI*2,0,Math.PI/2),M('silicone','main'),g,[-2.35,.25,1.5],[Math.PI/2,0,0]);
  dome.scale.set(1,.3,1);
  mesh(new THREE.TorusGeometry(.6,.035,8,48),MAT.housingSmooth,g,[-2.35,.25,1.79]);
  mesh(new THREE.TorusGeometry(.5,.06,10,40),MAT.housingSmooth,g,[2.75,1.25,1.53]);            // status LED
  mesh(cyl(.46,.46,.08,32),ledMat,g,[2.75,1.25,1.52],[Math.PI/2,0,0]);
  const glow=new THREE.Sprite(glowMat); glow.scale.set(2.1,2.1,1); glow.position.set(2.75,1.25,1.62); g.add(glow);
  for(let i=0;i<4;i++)for(let j=0;j<3;j++) mesh(cyl(.075,.075,.03,10),MAT.dot,g,[1.9+i*.34,-1.35+j*.34,1.535],[Math.PI/2,0,0]); // buzzer
  mesh(rbox(4.6,3.6,.7,.5,.14),M('housingSmooth','main'),g,[0,0,-1.8]);                        // mounting bracket
  mesh(cyl(.32,.32,.05,24),MAT.padBase,g,[2.9,-1.7,-1.5],[Math.PI/2,0,0]);                     // pressure vent
  if(mount==='tube'){
    mesh(rbox(4.2,2.5,1.2,.3,.12),M('silicone','clamp'),g,[0,0,-2.5]);
    [-1.35,1.35].forEach(x=>bandClamp(g,[x,0,-3.5],1.1,[Math.PI,0,Math.PI/2]));
    if(stub){
      mesh(cyl(1,1,17,48),MAT.alu,g,[0,0,-3.5],[0,0,Math.PI/2]);
      [-8.6,8.6].forEach(x=>mesh(cyl(.9,.9,.4,32),MAT.rubber,g,[x,0,-3.5],[0,0,Math.PI/2]));
    }
  }
  gland(g,[0,-3,0],null,'cable');
  anchor(g,[4.5,1,0],'main','본체 · 통신/배터리',C.ink);
  REG.focus.main={t:pos,d:58,theta:rotY+28*D2R};
  return g;
}
/* tail: 'front' (stand-alone) or 'side' (on a seat, connector next to the cable run) */
function makePad(parent,{pos,w,d,tail='front'}){
  const g=new THREE.Group(); g.position.set(...pos); g.rotation.x=-Math.PI/2; parent.add(g);
  mesh(rbox(w,d,.5,1.6,.2),M('padBase','pad'),g);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++) mesh(rbox(w/3-2,d/3-2,.12,.7,.05),M('padCell','pad'),g,[i*(w/3-.5),j*(d/3-.5),.27]);
  if(tail==='front'){
    mesh(rbox(3,5.5,.3,.5,.1),M('padBase','pad'),g,[w/2-4,-d/2-2,-.08]);
    mesh(rbox(3.3,1.6,.7,.3,.14),M('housing','pad'),g,[w/2-4,-d/2-5,.1]);
  }else{
    mesh(rbox(4.5,3,.3,.5,.1),M('padBase','pad'),g,[w/2+1.2,d/2-5,-.08]);
    mesh(rbox(1.6,3.3,.7,.3,.14),M('housing','pad'),g,[w/2+3.3,d/2-5,.1]);
  }
  anchor(g,[w/2-2,-(d/2-2),.5],'pad','착석 감지 패드',C.soft);
  return g;
}
function makeCable(parent,pts,at=.45){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'centripetal');
  const me=mesh(new THREE.TubeGeometry(curve,320,.3,16,false),M('cable','cable'),parent);
  anchor(parent,curve.getPoint(at).toArray(),'cable','방수 케이블',C.ink);
  return me;
}
function wheel(parent,c,R,tr,side,{spokes=0,handrim=false,hubR,disc=false}={}){
  const g=new THREE.Group(); g.position.set(...c); g.rotation.y=Math.PI/2; parent.add(g);
  mesh(new THREE.TorusGeometry(R-tr,tr,20,96),MAT.tire,g);
  if(spokes){
    mesh(new THREE.TorusGeometry(R-tr*2.1,.55,12,96),MAT.alu,g);
    for(let i=0;i<spokes;i++){const a=i/spokes*Math.PI*2;tube([0,0,(i%2?1:-1)*1.2],[Math.cos(a)*(R-tr*2.1),Math.sin(a)*(R-tr*2.1),0],.12,MAT.nickel,g,false);}
  }
  const hr=hubR||R*.12;
  if(disc){                                                          // moulded drive wheel
    mesh(cyl(R-tr*1.7,R-tr*1.7,tr*1.1,64),MAT.shell,g,null,[Math.PI/2,0,0]);
    mesh(cyl(hr,hr,tr*1.7,48),MAT.housingSmooth,g,null,[Math.PI/2,0,0]);
    mesh(cyl(hr*.35,hr*.35,tr*1.9,24),MAT.nickel,g,null,[Math.PI/2,0,0]);
  }else mesh(cyl(hr,hr,tr*1.6,32),spokes?MAT.alu:MAT.housingSmooth,g,null,[Math.PI/2,0,0]);
  if(handrim){
    mesh(new THREE.TorusGeometry(R-tr*3.2,.55,12,96),MAT.steel,g,[0,0,side*4]);
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2,rr=R-tr*3.2;tube([Math.cos(a)*rr,Math.sin(a)*rr,side*4],[Math.cos(a)*rr,Math.sin(a)*rr,side*1],.3,MAT.steel,g,false);}
  }
  return g;
}

}

    notes:['<b>막대</b> · 발받침 행거(수직 구간) 바깥, 앞 캐스터와 간섭 없음',
           '<b>본체</b> · 등받이 뒤 상단, 조이스틱 반대편 · 몸을 옮겨 앉는 동선 밖',
           '<b>전원</b> · 휠체어 배터리는 침수 시 꺼질 수 있어 본체 배터리 별도, 평소 충전 단자로 보조 충전',
           '<b>케이블</b> · 시트 아래를 따라 배선, 틸트·리클라인 동작 여유 확보',
           '<b>기록</b> · 잠긴 높이·시간을 저장해 보조기기 재지급 근거로 활용']}
};

/* ---------- state & UI ---------- */
let cur=null, theta=35*D2R, phi=16*D2R, zoom=1, auto=true, level=0, focus=null;
const cam={theta,phi,dist:165,t:new THREE.Vector3(0,24,-4)}; let snap=true;
const labelsEl=document.getElementById('labels'), partsEl=document.getElementById('parts');
let labelEls=[];
function setHighlight(k){
  Object.values(VIEWS).forEach(v=>Object.entries(v.parts).forEach(([p,ms])=>ms.forEach(m=>{
    m.emissive.setHex(p===k?C.blue:0); m.emissiveIntensity=p===k?.4:1;
  })));
  labelEls.forEach(l=>l.el.classList.toggle('hi',l.key===k));
  [...partsEl.children].forEach(li=>li.classList.toggle('hi',li.dataset.k===k));
}
const focusBtns=[...document.querySelectorAll('[data-focus]')];
function setFocus(f){
  focus=f; zoom=1;
  focusBtns.forEach(b=>b.classList.toggle('on',b.dataset.focus===f));
  if(f){setAuto(false);turnTo(cur.focus[f].theta);phi=10*D2R;}
}
function turnTo(t){theta=cam.theta+((((t-cam.theta)%(2*Math.PI))+3*Math.PI)%(2*Math.PI)-Math.PI);}
function show(k){
  if(cur) cur.group.visible=false;
  cur=VIEWS[k]; cur.group.visible=true; setFocus(null); snap=true;
  const t=cur.target, s=cur.span;
  key.position.set(t[0]-s*.8,t[1]+s*2.5,t[2]+s*1.05); key.target.position.set(...t);
  Object.assign(key.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:s*6}); key.shadow.camera.updateProjectionMatrix();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===k)));
  const tx=VIEW_TEXT[k];
  document.getElementById('pTitle').textContent=tx.title;
  document.getElementById('pSub').textContent=tx.sub;
  document.getElementById('notes').innerHTML=tx.notes.map(n=>`<li>${n}</li>`).join('');
  const keys=['main','probe','clamp','cable','pad'].filter(p=>cur.parts[p]);
  partsEl.innerHTML=keys.map(p=>`<li data-k="${p}"><b><i style="background:${PART_INFO[p].color}"></i>${PART_INFO[p].name}</b><small>${PART_INFO[p].d}</small></li>`).join('');
  [...partsEl.children].forEach(li=>{li.onmouseenter=()=>setHighlight(li.dataset.k);li.onmouseleave=()=>setHighlight(null);});
  labelsEl.innerHTML='';
  labelEls=cur.anchors.map(a=>{const el=document.createElement('div');el.className='lbl';el.innerHTML=`<i style="background:#${a.color.toString(16).padStart(6,'0')};border:1px solid rgba(22,32,43,.4)"></i>${a.text}`;labelsEl.appendChild(el);return{...a,el};});
  applyWater();
}
function applyWater(){
  Object.values(VIEWS).forEach(v=>v.sensors.forEach(s=>{const wet=level>=s.h;s.m.color.setHex(wet?0x1f5fbf:0xb4bcc4);s.m.emissive.setHex(wet?0x1f5fbf:0);s.m.emissiveIntensity=wet?.45:0;}));
  water.visible=level>0;
  if(cur){water.scale.set(cur.waterR,Math.max(level,.01),cur.waterR);water.position.y=level/2;}
  document.getElementById('wVal').textContent=level+' cm';
  const spans=[...document.getElementById('sens').children];
  SENS.forEach((h,i)=>spans[i].classList.toggle('wet',level>=h));
  const n=SENS.filter(h=>level>=h).length, st=document.getElementById('wState');
  st.className='state'+(n?' warn':'');
  st.textContent=n===0?'정상 · 물 감지 없음':n===1?'물 감지 · 바닥 센서와 교차 확인 중':n<4?`센서 ${n}칸 감지 · "지금 대피" 단계`:'바퀴 높이 이상 침수 · 구조 요청 · 휠체어 점검 필요';
  const col=n>=2?[0xff2a1e,0xff5a50]:n===1?[0xff9a10,0xffc040]:[0x12e07f,0x40ffa8];   // status LED follows the alert level
  ledMat.emissive.setHex(col[0]); glowMat.color.setHex(col[1]);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
document.getElementById('wl').oninput=e=>{level=+e.target.value;applyWater();};
const rot=document.getElementById('rot'), rotOut=document.getElementById('rotOut'), autoB=document.getElementById('auto');
function setAuto(v){auto=v;autoB.classList.toggle('on',v);}
autoB.onclick=()=>setAuto(!auto);
rot.oninput=()=>{setAuto(false);turnTo(rot.value*D2R);};
const PRESET={front:[0,10],side:[90,10],back:[180,10],top:[35,72]};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{setAuto(false);const[t,p]=PRESET[b.dataset.view];turnTo(t*D2R);phi=p*D2R;});
focusBtns.forEach(b=>b.onclick=()=>setFocus(focus===b.dataset.focus?null:b.dataset.focus));
const showLbl=document.getElementById('showLbl');
showLbl.onchange=()=>labelsEl.style.display=showLbl.checked?'':'none';
const darkB=document.getElementById('dark');
darkB.onclick=()=>{const on=darkB.classList.toggle('on');stage.classList.toggle('dark',on);shadowMat.opacity=on?.5:.22;renderer.toneMappingExposure=on?.9:1.05;};

/* orbit by drag / pinch / wheel */
const ptrs=new Map(); let pinch0=0, zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('drag');setAuto(false);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;}});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)zoom=Math.min(1.6,Math.max(.3,zoom0*pinch0/d));return;}
  theta-=dx*.008; phi=Math.min(80*D2R,Math.max(1*D2R,phi+dy*.006));
});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(!ptrs.size)canvas.classList.remove('drag');pinch0=0;}));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.6,Math.max(.3,zoom*(1+e.deltaY*.001)));},{passive:false});


/* fullscreen */
(function(){
  const b=document.getElementById('fsBtn'),st=document.getElementById('stage');
  const native=st.requestFullscreen||st.webkitRequestFullscreen;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const isOn=()=>!!fsEl()||st.classList.contains('full');
  function sync(){const on=isOn();b.querySelector('span').textContent=on?'닫기':'전체 화면';b.setAttribute('aria-label',on?'전체 화면 닫기':'전체 화면으로 보기');b.querySelector('.i-open').style.display=on?'none':'';b.querySelector('.i-close').style.display=on?'':'none';document.body.classList.toggle('nofs-scroll',st.classList.contains('full'));}
  b.onclick=()=>{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
    if(st.classList.contains('full')){st.classList.remove('full');sync();return;}
    if(native){const r=native.call(st);if(r&&r.catch)r.catch(()=>{st.classList.add('full');sync();});}
    else{st.classList.add('full');sync();}
  };
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.classList.contains('full')){st.classList.remove('full');sync();}});
})();
/* resize */
let W=1,H=1;
function resize(){W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();

/* loop */
const v3=new THREE.Vector3(), tv=new THREE.Vector3(), ray=new THREE.Raycaster(); ray.camera=camera; let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(auto) theta+=dt*.4;
  const f=focus&&cur.focus[focus], t=f?f.t:cur.target, narrow=W/H<1?1.35:1, d=(f?f.d:cur.dist)*zoom*narrow;
  const k=snap?1:1-Math.exp(-dt*7); snap=false;
  cam.theta+=(theta-cam.theta)*k; cam.phi+=(phi-cam.phi)*k; cam.dist+=(d-cam.dist)*k; cam.t.lerp(tv.set(...t),k);
  camera.position.set(cam.t.x+cam.dist*Math.cos(cam.phi)*Math.sin(cam.theta),cam.t.y+cam.dist*Math.sin(cam.phi),cam.t.z+cam.dist*Math.cos(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.t);
  const pulse=.8+.2*Math.sin(now*.003);
  ledMat.emissiveIntensity=1.1*pulse; glowMat.opacity=.6*pulse;
  renderer.render(scene,camera);
  const deg=Math.round(((theta/D2R)%360+360)%360);
  if(document.activeElement!==rot){rot.value=deg;} rotOut.textContent=deg+'°';
  if(showLbl.checked) labelEls.forEach(l=>{l.o.getWorldPosition(v3);
    const dist=v3.distanceTo(camera.position);
    ray.set(camera.position,v3.clone().sub(camera.position).normalize());
    const hit=ray.intersectObject(cur.group,true).find(h=>h.object.isMesh&&!h.object.material.transparent);
    const hidden=hit&&hit.distance<dist-2.5;
    v3.project(camera);
    l.el.style.opacity=v3.z>=1?0:hidden?.3:1;
    l.el.style.left=((v3.x+1)/2*W)+'px'; l.el.style.top=((1-v3.y)/2*H)+'px';});
  requestAnimationFrame(frame);
}
const q=new URLSearchParams(location.search);
if(q.get('lv')){level=+q.get('lv');document.getElementById('wl').value=level;}
show(VIEWS[q.get('v')]?q.get('v'):'tag');
if(q.get('a')){setAuto(false);theta=cam.theta=+q.get('a')*D2R;}
if(q.get('f')&&cur.focus[q.get('f')]){setFocus(q.get('f'));cam.theta=theta;snap=true;}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
