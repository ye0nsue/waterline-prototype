<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATERLINE 휠체어 태그 · 제품 목업</title>
<style>
:root{--bg:#f4f4f1;--ink:#16202B;--mute:#6b7682;--line:rgba(22,32,43,.12);--card:rgba(255,255,255,.78);--blue:#1F5FBF}
body.dark{--bg:#0f1317;--ink:#eef2f5;--mute:#93a0ad;--line:rgba(255,255,255,.14);--card:rgba(24,30,37,.78)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#f1f1ee 45%,#d9dad5 100%)}
body.dark #stage{background:radial-gradient(120% 90% at 50% 38%,#2a3139 0%,#161b21 50%,#07090b 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
header{position:fixed;left:24px;top:20px;z-index:3;pointer-events:none}
header b{font-size:15px;letter-spacing:.18em;font-weight:800}
header span{display:block;margin-top:4px;font-size:12px;color:var(--mute)}
.hint{position:fixed;right:24px;top:22px;font-size:12px;color:var(--mute);z-index:3}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;transform:translate(14px,-50%);padding:5px 10px;border-radius:999px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap;transition:opacity .2s}
.lbl::before{content:"";position:absolute;left:-15px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.2)}
.lbl small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:1px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(100% - 24px)}
.grp{display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line)}
button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{background:var(--line)}
button.on{background:var(--ink);color:var(--bg)}
.grp label{font-size:12.5px;font-weight:600;padding:0 6px 0 10px}
.grp output{font-size:12.5px;font-weight:700;min-width:46px;text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
input[type=range]{width:150px;accent-color:var(--blue)}
#state{position:fixed;left:24px;bottom:84px;z-index:3;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px)}
#state.warn{background:var(--blue);color:#fff;border-color:transparent}
@media(max-width:640px){.hint{display:none}#state{left:12px;bottom:150px}input[type=range]{width:110px}}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><div id="labels"></div></div>
<header><b>WATERLINE</b><span>휠체어 태그 · 제품 목업 (단위 cm, 실제 비율)</span></header>
<div class="hint">드래그로 회전 · 휠/핀치로 확대</div>
<div id="state">정상 · 물 감지 없음</div>
<div class="bar">
  <div class="grp">
    <button id="auto" class="on">자동 회전</button>
    <button data-view="hero">전체</button>
    <button data-view="front">정면</button>
    <button data-view="side">측면</button>
    <button data-view="back">후면</button>
    <button data-view="main">본체 확대</button>
    <button data-view="probe">센서 확대</button>
  </div>
  <div class="grp"><label for="wl">수위</label><input id="wl" type="range" min="0" max="34" value="0"><output id="wVal">0 cm</output></div>
  <div class="grp"><button id="lblB">라벨</button><button id="bgB">어두운 배경</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const D2R=Math.PI/180;
const canvas=document.getElementById('gl'), stage=document.getElementById('stage');

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(26,1,1,3000);

/* ---------- studio environment (softboxes baked into a reflection map) ---------- */
(function(){
  const env=new THREE.Scene();
  const room=new THREE.Mesh(new THREE.BoxGeometry(200,120,200),new THREE.MeshBasicMaterial({color:new THREE.Color(.06,.063,.066),side:THREE.BackSide}));
  room.position.y=40; env.add(room);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:new THREE.Color(.12,.12,.115)}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-19.5; env.add(floor);
  function panel(w,h,pos,k){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k*1.02),side:THREE.DoubleSide}));
    m.position.set(...pos); m.lookAt(0,10,0); env.add(m);
  }
  panel(110,80,[0,98,10],1.5);        // top softbox
  panel(50,90,[-95,40,50],1.2);       // key strip, front-left
  panel(26,100,[95,45,-30],1.5);      // rim strip, back-right
  panel(70,40,[30,30,98],.25);      // low front fill
  panel(60,14,[-40,70,-98],.9);      // back kicker
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,.03).texture;
  pm.dispose();
})();

const key=new THREE.DirectionalLight(0xffffff,.85);
key.position.set(-60,190,80); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:10,far:400});
key.shadow.bias=-.0006; key.shadow.normalBias=.06; key.shadow.radius=6;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8b8b0,.18));

/* ---------- procedural textures ---------- */
function noiseTex(size,fn,rep){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'), im=x.createImageData(size,size);
  for(let i=0;i<size*size;i++){const v=fn(i%size,(i/size)|0);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}
  x.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); t.anisotropy=8; return t;
}
const grainTex=noiseTex(256,()=>110+Math.random()*90,2.2);          // VDI-style fine mould texture
const softTex=noiseTex(128,()=>120+Math.random()*50,1.2);           // rubber / silicone
const brushTex=(()=>{const row=[];return noiseTex(256,(x,y)=>{if(row[y]===undefined)row[y]=120+Math.random()*110;return row[y]*.75+Math.random()*50;},1);})();
const weaveTex=noiseTex(64,(x,y)=>((x>>2)+(y>>2))%2?170:120,6);

/* ---------- materials ---------- */
const S=o=>new THREE.MeshStandardMaterial(o), P=o=>new THREE.MeshPhysicalMaterial(o);
const MAT={
  housing:S({color:0x2a2f35,roughness:.82,metalness:0,bumpMap:grainTex,bumpScale:.012}),
  housingSmooth:S({color:0x23272c,roughness:.5}),
  panel:P({color:0x14171b,roughness:.38,clearcoat:.5,clearcoatRoughness:.3}),
  bumper:S({color:0x1c62c9,roughness:.72,bumpMap:softTex,bumpScale:.006}),
  silicone:S({color:0x3a4047,roughness:.93,bumpMap:softTex,bumpScale:.004}),
  rubber:S({color:0x15181c,roughness:.9,bumpMap:softTex,bumpScale:.006}),
  cable:S({color:0x121417,roughness:.62}),
  steel:S({color:0xd9dde0,roughness:.3,metalness:1,roughnessMap:brushTex,envMapIntensity:1.1}),
  alu:S({color:0xc6cace,roughness:.42,metalness:1,roughnessMap:brushTex,envMapIntensity:.9}),
  nickel:S({color:0xb9bdc2,roughness:.22,metalness:1}),
  probe:P({color:0xf4f5f5,roughness:.42,clearcoat:.35,clearcoatRoughness:.35}),
  mark:S({color:0x7d8791,roughness:.7}),
  padBase:S({color:0xdfe5ec,roughness:.88,bumpMap:weaveTex,bumpScale:.01}),
  padCell:S({color:0x3478dc,roughness:.6,bumpMap:softTex,bumpScale:.004}),
  led:S({color:0x0c2a1c,roughness:.55,emissive:0x12e07f,emissiveIntensity:1}),
  dot:S({color:0x08090a,roughness:.9})
};
const PARTS={main:[],probe:[],clamp:[],cable:[],pad:[]};

/* ---------- geometry helpers ---------- */
function creased(g,deg=28){
  g=g.index?g.toNonIndexed():g;
  const p=g.attributes.position, n=p.count/3, fn=[], cos=Math.cos(deg*D2R), map=new Map();
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
  const keyOf=i=>Math.round(p.getX(i)*2e3)+'_'+Math.round(p.getY(i)*2e3)+'_'+Math.round(p.getZ(i)*2e3);
  for(let f=0;f<n;f++){
    a.fromBufferAttribute(p,f*3);b.fromBufferAttribute(p,f*3+1);c.fromBufferAttribute(p,f*3+2);
    fn.push(b.sub(a).cross(c.sub(a)).clone());          // area-weighted
    for(let k=0;k<3;k++){const kk=keyOf(f*3+k);(map.get(kk)||map.set(kk,[]).get(kk)).push(f);}
  }
  const un=fn.map(v=>v.clone().normalize()), out=new Float32Array(p.count*3), acc=new THREE.Vector3();
  for(let f=0;f<n;f++)for(let k=0;k<3;k++){
    const i=f*3+k; acc.set(0,0,0);
    if(Math.abs(un[f].z)>.9995) acc.copy(un[f]);        // keep cap faces dead flat
    else{ map.get(keyOf(i)).forEach(o=>{if(un[o].dot(un[f])>=cos&&Math.abs(un[o].z)<=.9995)acc.add(fn[o]);}); acc.normalize(); }
    out[i*3]=acc.x;out[i*3+1]=acc.y;out[i*3+2]=acc.z;
  }
  g.setAttribute('normal',new THREE.BufferAttribute(out,3)); return g;
}
function rrShape(w,h,r){
  r=Math.max(.001,Math.min(r,w/2-.001,h/2-.001));
  const s=new THREE.Shape(),x=w/2,y=h/2;
  s.moveTo(-x+r,-y);s.lineTo(x-r,-y);s.absarc(x-r,-y+r,r,-Math.PI/2,0,false);
  s.lineTo(x,y-r);s.absarc(x-r,y-r,r,0,Math.PI/2,false);
  s.lineTo(-x+r,y);s.absarc(-x+r,y-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(-x,-y+r);s.absarc(-x+r,-y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}
/* rounded box: w×h outline (corner radius r) extruded along z by d, edge fillet b */
function rbox(w,h,d,r,b){
  b=Math.min(b,d/2-.001,w/2-.001,h/2-.001);
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,Math.max(r-b,.001)),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:5,curveSegments:14});
  g.center(); return creased(g);
}
function mesh(geo,mat,parent,pos,rot,part){
  const m=new THREE.Mesh(geo,mat); m.castShadow=m.receiveShadow=true;
  if(pos)m.position.set(...pos); if(rot)m.rotation.set(...rot);
  parent.add(m); if(part)PARTS[part].push(m); return m;
}
const cyl=(r1,r2,h,seg=40,open=false)=>new THREE.CylinderGeometry(r1,r2,h,seg,1,open);
function lathe(pts,seg=48){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
/* worm-drive band clamp around a tube whose axis is local Y */
function bandClamp(parent,pos,R,rot,part='clamp'){
  const g=new THREE.Group(); g.position.set(...pos); if(rot)g.rotation.set(...rot); parent.add(g);
  const band=new THREE.Mesh(cyl(R,R,.8,56,true),MAT.steel.clone()); band.material.side=THREE.DoubleSide;
  band.castShadow=true; g.add(band); PARTS[part].push(band);
  // perforation slots
  for(let i=0;i<9;i++){const a=Math.PI+(-.55+i*.1375);mesh(new THREE.BoxGeometry(.07,.42,.03),MAT.dot,g,[Math.sin(a)*(R+.005),0,Math.cos(a)*(R+.005)],[0,a,0]);}
  mesh(rbox(1.25,.95,.75,.15,.08),MAT.steel,g,[0,0,-R-.3],null,part);                  // screw housing
  mesh(cyl(.2,.2,1.7,20),MAT.nickel,g,[.1,0,-R-.36],[0,0,Math.PI/2],part);             // worm screw
  mesh(cyl(.36,.36,.3,6),MAT.nickel,g,[1,0,-R-.36],[0,0,Math.PI/2],part);              // hex head
  return g;
}
/* M12 cable gland with flex strain relief, cable exits along -Y */
function gland(parent,pos,rot,part){
  const g=new THREE.Group(); g.position.set(...pos); if(rot)g.rotation.set(...rot); parent.add(g);
  mesh(cyl(.78,.78,.34,6),MAT.nickel,g,[0,-.17,0],null,part);
  mesh(cyl(.6,.6,.22,32),MAT.nickel,g,[0,-.45,0],null,part);
  const nut=mesh(cyl(.56,.72,.52,6),MAT.rubber,g,[0,-.82,0],null,part);
  const prof=[[0,-1.08]]; for(let i=0;i<5;i++){const y=-1.08-i*.26,r=.5-i*.035;prof.push([r,y],[r,y-.15],[r-.07,y-.17],[r-.07,y-.26]);}
  prof.push([.3,-2.4],[0,-2.4]);
  mesh(lathe(prof.reverse()),MAT.rubber,g,null,null,part);
  return g;
}

/* ---------- product ---------- */
const product=new THREE.Group(); scene.add(product);
const SENS=[5,10,20,30], PROBE_BOTTOM=2, PROBE_LEN=42, sensors=[], anchors=[];
function anchor(parent,pos,key,text,sub){const o=new THREE.Object3D();o.position.set(...pos);parent.add(o);anchors.push({o,key,text,sub});}

/* --- water probe --- */
(function(){
  const g=new THREE.Group(); g.position.set(-13,PROBE_BOTTOM,4); product.add(g);
  mesh(rbox(2.8,PROBE_LEN,1.5,.55,.16),MAT.probe,g,[0,PROBE_LEN/2,0],null,'probe');
  mesh(rbox(.9,PROBE_LEN-6,.04,.2,.015),MAT.housingSmooth,g,[0,PROBE_LEN/2,-.75],null,'probe');   // potting seam, back
  // sensing windows (capacitive electrodes sit behind the wall)
  SENS.forEach(h=>{
    const y=h-PROBE_BOTTOM;
    mesh(rbox(2.24,2.74,.05,.36,.02),MAT.mark,g,[0,y,.735],null,'probe');
    const m=S({color:0xb4bcc4,roughness:.5,metalness:.15,emissive:0x000000});
    mesh(rbox(2.06,2.56,.06,.3,.025),m,g,[0,y,.745],null,'probe');
    mesh(new THREE.BoxGeometry(.5,.045,.02),MAT.mark,g,[1.02,y,.752]);          // level tick
    sensors.push({m,h});
  });
  for(let y=4;y<=38;y+=2) if(!SENS.includes(y+PROBE_BOTTOM)) mesh(new THREE.BoxGeometry(y%10===8?.34:.2,.035,.02),MAT.mark,g,[1.15,y,.752]);
  // overmoulded top cap + strain relief
  mesh(rbox(3.16,3.2,1.86,.62,.2),MAT.housing,g,[0,PROBE_LEN+.5,0],null,'probe');
  mesh(new THREE.BoxGeometry(3.17,.05,1.87),MAT.dot,g,[0,PROBE_LEN-.55,0]);
  gland(g,[0,PROBE_LEN+2.1,0],[Math.PI,0,0],'probe');
  // TPU foot
  mesh(rbox(3.16,1.8,1.86,.6,.24),MAT.rubber,g,[0,.3,0],null,'probe');
  // frame stub + clamps
  mesh(cyl(1.2,1.2,36,48),MAT.alu,g,[0,23,-2.6]);
  [43,3].forEach(y=>mesh(cyl(1.08,1.08,.5,32),MAT.rubber,g,[0,y-2+(y>20?.2:-.2),-2.6]));
  [8,22,36].forEach(y=>{
    mesh(rbox(2.5,2.3,1.1,.3,.12),MAT.silicone,g,[0,y,-1.2],null,'clamp');    // silicone saddle
    bandClamp(g,[0,y,-2.6],1.25);
  });
  anchor(g,[1.4,PROBE_LEN*.6,.8],'probe','물 감지 막대','42 cm · 정전용량 센서 4칸');
  anchor(g,[1.3,36,-2.6],'clamp','밴드 클램프','스테인리스 + 실리콘 패드');
})();

/* --- main unit 9 × 6 × 3 cm --- */
let ledMat, glow;
(function(){
  const g=new THREE.Group(); g.position.set(14,32,4); product.add(g);
  mesh(rbox(9,6,3,1.15,.42),MAT.housing,g,null,null,'main');
  mesh(rbox(9.3,6.3,1.15,1.3,.3),MAT.bumper,g,null,null,'main');                 // TPU bumper band around the edge
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>mesh(rbox(1.5,1.5,1.5,.7,.3),MAT.bumper,g,[sx*3.98,sy*2.48,0],null,'main')); // corner guards
  mesh(rbox(7.5,4.5,.08,.75,.03),MAT.panel,g,[0,0,1.49],null,'main');            // inset front panel
  // SOS button
  mesh(new THREE.TorusGeometry(1.27,.09,14,64),MAT.housingSmooth,g,[-2.35,.25,1.53],null,'main');
  const dome=mesh(new THREE.SphereGeometry(1.14,48,24,0,Math.PI*2,0,Math.PI/2),MAT.silicone,g,[-2.35,.25,1.5],[Math.PI/2,0,0],'main');
  dome.scale.set(1,.3,1);
  mesh(new THREE.TorusGeometry(.6,.035,8,48),MAT.housingSmooth,g,[-2.35,.25,1.79]); // tactile ring
  // status LED behind frosted window
  mesh(new THREE.TorusGeometry(.5,.06,10,40),MAT.housingSmooth,g,[2.75,1.25,1.53]);
  ledMat=MAT.led; mesh(cyl(.46,.46,.08,32),ledMat,g,[2.75,1.25,1.52],[Math.PI/2,0,0]);
  const gc=document.createElement('canvas'); gc.width=gc.height=128; const gx=gc.getContext('2d');
  const gr=gx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(60,255,170,.85)'); gr.addColorStop(.25,'rgba(40,255,160,.3)'); gr.addColorStop(1,'rgba(40,255,160,0)');
  gx.fillStyle=gr; gx.fillRect(0,0,128,128);
  glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  glow.scale.set(2.1,2.1,1); glow.position.set(2.75,1.25,1.62); g.add(glow);
  // buzzer port
  for(let i=0;i<4;i++)for(let j=0;j<3;j++) mesh(cyl(.075,.075,.03,10),MAT.dot,g,[1.9+i*.34,-1.35+j*.34,1.535],[Math.PI/2,0,0]);
  // rear mount: bracket + saddle + frame stub + bands
  mesh(rbox(4.6,3.6,.7,.5,.14),MAT.housingSmooth,g,[0,0,-1.8],null,'main');
  mesh(rbox(4.2,2.5,1.2,.3,.12),MAT.silicone,g,[0,0,-2.5],null,'clamp');
  mesh(cyl(1.05,1.05,17,48),MAT.alu,g,[0,0,-3.5],[0,0,Math.PI/2]);
  [-8.6,8.6].forEach(x=>mesh(cyl(.95,.95,.4,32),MAT.rubber,g,[x,0,-3.5],[0,0,Math.PI/2]));
  [-1.35,1.35].forEach(x=>bandClamp(g,[x,0,-3.5],1.1,[Math.PI,0,Math.PI/2]));
  mesh(cyl(.32,.32,.05,24),MAT.padBase,g,[2.9,-1.7,-1.5],[Math.PI/2,0,0]);          // pressure vent membrane
  gland(g,[0,-3,0],null,'cable');
  anchor(g,[4.7,.6,.4],'main','본체 · 통신/배터리','9 × 6 × 3 cm · IP68');
})();

/* --- cable (drip loop into the bottom gland) --- */
(function(){
  const pts=[[-13,48.4,4],[-13,50.6,4],[-11.2,53.4,4.3],[-4,54.2,5],[3,49.5,5.6],[6.8,40,5.8],[7.4,31,5.4],[8.2,25.6,4.8],[11,23.2,4.2],[13.6,24.2,4],[14,25.6,4],[14,27.4,4]];
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'centripetal');
  mesh(new THREE.TubeGeometry(curve,260,.3,18,false),MAT.cable,product,null,null,'cable');
  anchor(product,curve.getPoint(.4).toArray(),'cable','방수 케이블','PUR 피복 · 드립 루프');
})();

/* --- seat pressure pad --- */
(function(){
  const g=new THREE.Group(); g.position.set(0,.3,-28); g.rotation.x=-Math.PI/2; product.add(g);
  const w=32,d=28;
  mesh(rbox(w,d,.5,1.6,.2),MAT.padBase,g,null,null,'pad');
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++) mesh(rbox(w/3-2,d/3-2,.12,.7,.05),MAT.padCell,g,[i*(w/3-.5),j*(d/3-.5),.27],null,'pad');
  mesh(rbox(3,5.5,.3,.5,.1),MAT.padBase,g,[w/2-4,-d/2-2,-.08],null,'pad');             // flex tail
  mesh(rbox(3.3,1.6,.7,.3,.14),MAT.housing,g,[w/2-4,-d/2-5,.1],null,'pad');            // tail connector
  anchor(g,[w/2-3,-d/2+3,.4],'pad','착석 감지 패드','두께 5 mm · 압력 9셀');
})();

/* --- shadow catcher + water --- */
const shadowMat=new THREE.ShadowMaterial({opacity:.22});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(700,700),shadowMat); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const waterMat=S({color:0x2a7be0,roughness:.04,metalness:0,transparent:true,opacity:.34,depthWrite:false,envMapIntensity:1.6});
const water=new THREE.Mesh(cyl(62,62,1,96),waterMat); water.visible=false; water.renderOrder=2; scene.add(water);

/* ---------- state ---------- */
let theta=35*D2R,phi=14*D2R,zoom=1,auto=true,level=0;
const HERO={t:[0,25,-4],d:205};
let tgt=new THREE.Vector3(...HERO.t),dist=HERO.d;
const cam={theta,phi,dist,t:tgt.clone()};
const PRESET={hero:[35,14,HERO],front:[0,8,HERO],side:[90,8,HERO],back:[180,8,HERO],main:[28,10,{t:[13.5,31,4],d:52}],probe:[22,6,{t:[-13,17,4],d:95}]};
const autoB=document.getElementById('auto');
function setAuto(v){auto=v;autoB.classList.toggle('on',v);}
autoB.onclick=()=>setAuto(!auto);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  setAuto(false);const[t,p,o]=PRESET[b.dataset.view];
  theta=cam.theta+((((t*D2R-cam.theta)%(2*Math.PI))+3*Math.PI)%(2*Math.PI)-Math.PI);
  phi=p*D2R;tgt.set(...o.t);dist=o.d;zoom=1;});

function applyWater(){
  sensors.forEach(s=>{const wet=level>=s.h;s.m.color.setHex(wet?0x1f5fbf:0xb4bcc4);s.m.emissive.setHex(wet?0x1f5fbf:0);s.m.emissiveIntensity=wet?.45:0;});
  water.visible=level>0;water.scale.y=Math.max(level,.01);water.position.y=level/2;
  document.getElementById('wVal').textContent=level+' cm';
  const n=SENS.filter(h=>level>=h).length,st=document.getElementById('state');
  st.className=n?'warn':'';
  st.textContent=n===0?'정상 · 물 감지 없음':n===1?'물 감지 · 바닥 센서와 교차 확인 중':n<4?`센서 ${n}칸 감지 · "지금 대피" 단계`:'바퀴 높이 이상 침수 · 구조 요청';
  ledMat.emissive.setHex(n>=2?0xff2a1e:n===1?0xff9a10:0x12e07f);
  glow.material.color.setHex(n>=2?0xff5a50:n===1?0xffc040:0xffffff);
}
document.getElementById('wl').oninput=e=>{level=+e.target.value;applyWater();};

const labelsEl=document.getElementById('labels');labelsEl.style.display='none';
const labelEls=anchors.map(a=>{const el=document.createElement('div');el.className='lbl';el.innerHTML=`${a.text}<small>${a.sub}</small>`;labelsEl.appendChild(el);return{...a,el};});
const lblB=document.getElementById('lblB');
lblB.onclick=()=>{const on=lblB.classList.toggle('on');labelsEl.style.display=on?'':'none';};
const bgB=document.getElementById('bgB');
bgB.onclick=()=>{const on=bgB.classList.toggle('on');document.body.classList.toggle('dark',on);shadowMat.opacity=on?.5:.22;renderer.toneMappingExposure=on?.9:1.05;};

/* orbit */
const ptrs=new Map();let pinch0=0,zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('drag');setAuto(false);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;}});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)zoom=Math.min(1.8,Math.max(.3,zoom0*pinch0/d));return;}
  theta-=dx*.008;phi=Math.min(82*D2R,Math.max(1*D2R,phi+dy*.006));});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(!ptrs.size)canvas.classList.remove('drag');pinch0=0;}));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.8,Math.max(.3,zoom*(1+e.deltaY*.001)));},{passive:false});

let W=1,H=1;
function resize(){W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

const v3=new THREE.Vector3();let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(auto)theta+=dt*.3;
  const k=1-Math.exp(-dt*7);
  cam.theta+=(theta-cam.theta)*k;cam.phi+=(phi-cam.phi)*k;cam.t.lerp(tgt,k);
  cam.dist+=(dist*zoom*(W/H<1?1.5:1)-cam.dist)*k;
  camera.position.set(cam.t.x+cam.dist*Math.cos(cam.phi)*Math.sin(cam.theta),cam.t.y+cam.dist*Math.sin(cam.phi),cam.t.z+cam.dist*Math.cos(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.t);
  const pulse=.8+.2*Math.sin(now*.003);
  ledMat.emissiveIntensity=1.1*pulse;glow.material.opacity=.6*pulse;
  renderer.render(scene,camera);
  if(labelsEl.style.display!=='none')labelEls.forEach(l=>{l.o.getWorldPosition(v3).project(camera);l.el.style.opacity=v3.z>=1?0:1;l.el.style.left=((v3.x+1)/2*W)+'px';l.el.style.top=((1-v3.y)/2*H)+'px';});
  requestAnimationFrame(frame);
}
applyWater();
const q=new URLSearchParams(location.search);
if(q.get('a')){setAuto(false);theta=cam.theta=+q.get('a')*D2R;}
if(q.get('v')&&PRESET[q.get('v')]){setAuto(false);const[t,p,o]=PRESET[q.get('v')];theta=cam.theta=t*D2R;phi=cam.phi=p*D2R;tgt.set(...o.t);cam.t.copy(tgt);dist=o.d;cam.dist=dist;}
if(q.get('lv')){level=+q.get('lv');document.getElementById('wl').value=level;applyWater();}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
